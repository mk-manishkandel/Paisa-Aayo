name: Release

# Push a tag like v1.0.0 to build a signed APK and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is missing. See README → Releasing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PAISA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          PAISA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PAISA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PAISA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew test assembleRelease --console=plain \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PaisaAayo-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
