name: Release

# Push a tag like v1.0.0 to build a signed APK and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is missing. See README → Releasing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PAISA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK (GitHub) and app bundle (Google Play)
        env:
          PAISA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PAISA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PAISA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode is derived from VERSION in app/build.gradle.kts (1.2.3 -> 10203).
          ./gradlew test lintRelease assembleRelease bundleRelease --console=plain -PversionName="$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PaisaAayo-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/PaisaAayo-$VERSION.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/PaisaAayo-$VERSION-mapping.txt"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/*.aab
            dist/*-mapping.txt
            dist/SHA256SUMS.txt
          generate_release_notes: true

      # Optional: add a PLAY_SERVICE_ACCOUNT_JSON secret (see docs/play/README.md) to also upload
      # the bundle to Google Play. Track: repository variable PLAY_TRACK (internal, alpha = closed
      # testing, beta = open testing, production); defaults to internal. Skipped without the secret.
      - name: Check for Google Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play (${{ vars.PLAY_TRACK || 'internal' }})
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.mkmanishkandel.paisaaayo
          releaseFiles: dist/PaisaAayo-${{ env.VERSION }}.aab
          mappingFile: dist/PaisaAayo-${{ env.VERSION }}-mapping.txt
          whatsNewDirectory: fastlane/metadata/android/whatsnew
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
